<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="810" viewBox="0 0 1080 810" role="img" aria-labelledby="title desc"><title id="title">My go-to-market workflow</title><desc id="desc">Market insight to launch planning to campaign activation to measurement and iteration. Core skills: SQL, user research, A/B testing and project management.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1080" height="810" rx="18" fill="#0d1117"/><text x="32" y="47" font-size="22" fill="#f0f6fc" font-weight="700">FROM INSIGHT TO LAUNCH TO LEARNING</text><text x="32" y="77" font-size="16" fill="#8b949e" font-weight="400">Product marketing informed by users, culture and evidence.</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#79c0ff" stroke-width="1.5"/></marker></defs><rect x="24" y="110" width="492" height="270" rx="14" fill="#161b22" stroke="#30363d"/><text x="48" y="149" font-size="18" fill="#79c0ff" font-weight="700">01</text><text x="88" y="149" font-size="22" fill="#f0f6fc" font-weight="700">Market insight &amp; strategy</text><text x="48" y="193" font-size="15" fill="#c9d1d9" font-weight="400">Competitor research and audience interviews</text><text x="48" y="224" font-size="15" fill="#c9d1d9" font-weight="400">Connect cultural trends to publishing motivation</text><text x="48" y="255" font-size="15" fill="#c9d1d9" font-weight="400">Gen Z humour, video trends and women’s agency</text><rect x="48" y="315" width="107.10000000000001" height="30" rx="6" fill="#172a3e"/><text x="58" y="335" font-size="11" fill="#a5d6ff" font-weight="700">USER RESEARCH</text><rect x="163.10000000000002" y="315" width="40.1" height="30" rx="6" fill="#172a3e"/><text x="173.10000000000002" y="335" font-size="11" fill="#a5d6ff" font-weight="700">SQL</text><rect x="211.20000000000002" y="315" width="113.8" height="30" rx="6" fill="#172a3e"/><text x="221.20000000000002" y="335" font-size="11" fill="#a5d6ff" font-weight="700">TREND ANALYSIS</text><rect x="564" y="110" width="492" height="270" rx="14" fill="#161b22" stroke="#30363d"/><text x="588" y="149" font-size="18" fill="#79c0ff" font-weight="700">02</text><text x="628" y="149" font-size="22" fill="#f0f6fc" font-weight="700">Launch planning</text><text x="588" y="193" font-size="15" fill="#c9d1d9" font-weight="400">Build annual marketing calendars and timelines</text><text x="588" y="224" font-size="15" fill="#c9d1d9" font-weight="400">Define objectives, audiences and success measures</text><text x="588" y="255" font-size="15" fill="#c9d1d9" font-weight="400">Align product, design, engineering and resources</text><rect x="588" y="315" width="140.60000000000002" height="30" rx="6" fill="#172a3e"/><text x="598" y="335" font-size="11" fill="#a5d6ff" font-weight="700">PROJECT MANAGEMENT</text><rect x="736.6" y="315" width="113.8" height="30" rx="6" fill="#172a3e"/><text x="746.6" y="335" font-size="11" fill="#a5d6ff" font-weight="700">PRIORITISATION</text><rect x="564" y="428" width="492" height="270" rx="14" fill="#161b22" stroke="#30363d"/><text x="588" y="467" font-size="18" fill="#79c0ff" font-weight="700">03</text><text x="628" y="467" font-size="22" fill="#f0f6fc" font-weight="700">Campaign activation</text><text x="588" y="511" font-size="15" fill="#c9d1d9" font-weight="400">Translate product features into stories and themes</text><text x="588" y="542" font-size="15" fill="#c9d1d9" font-weight="400">Plan KOL / KOC and celebrity collaborations</text><text x="588" y="573" font-size="15" fill="#c9d1d9" font-weight="400">Develop creative concepts around platform trends</text><rect x="588" y="633" width="100.4" height="30" rx="6" fill="#172a3e"/><text x="598" y="653" font-size="11" fill="#a5d6ff" font-weight="700">STORYTELLING</text><rect x="696.4" y="633" width="154.0" height="30" rx="6" fill="#172a3e"/><text x="706.4" y="653" font-size="11" fill="#a5d6ff" font-weight="700">CREATOR PARTNERSHIPS</text><rect x="24" y="428" width="492" height="270" rx="14" fill="#161b22" stroke="#30363d"/><text x="48" y="467" font-size="18" fill="#79c0ff" font-weight="700">04</text><text x="88" y="467" font-size="22" fill="#f0f6fc" font-weight="700">Measurement &amp; decisions</text><text x="48" y="511" font-size="15" fill="#c9d1d9" font-weight="400">Build content-trend monitoring and analysis workflows</text><text x="48" y="542" font-size="15" fill="#c9d1d9" font-weight="400">Produce weekly / monthly reviews and insights</text><text x="48" y="573" font-size="15" fill="#c9d1d9" font-weight="400">Use funnel analysis and experiments to guide iteration</text><rect x="48" y="633" width="40.1" height="30" rx="6" fill="#172a3e"/><text x="58" y="653" font-size="11" fill="#a5d6ff" font-weight="700">SQL</text><rect x="96.1" y="633" width="93.7" height="30" rx="6" fill="#172a3e"/><text x="106.1" y="653" font-size="11" fill="#a5d6ff" font-weight="700">A/B TESTING</text><rect x="197.8" y="633" width="127.2" height="30" rx="6" fill="#172a3e"/><text x="207.8" y="653" font-size="11" fill="#a5d6ff" font-weight="700">DECISION SUPPORT</text><g fill="none" stroke="#79c0ff" stroke-width="2" marker-end="url(#arrow)"><path d="M522 245 H552"/><path d="M810 388 V416"/><path d="M552 563 H526"/></g><text x="32" y="749" font-size="15" fill="#79c0ff" font-weight="700">LEARN → REFINE THE NEXT STRATEGY</text><text x="32" y="777" font-size="15" fill="#8b949e" font-weight="400">Insights from campaign performance feed back into positioning, priorities and the next launch.</text></g></svg>
